<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEC724"/>
      <stop offset="50%" stop-color="#F4B301"/>
      <stop offset="100%" stop-color="#C28A00"/>
    </linearGradient>
    <linearGradient id="pNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2D6F"/>
      <stop offset="100%" stop-color="#001C48"/>
    </linearGradient>
  </defs>
  <!-- Lingkar Dasar Navy -->
  <circle cx="32" cy="32" r="30" fill="url(#pNavy)" stroke="url(#pGold)" stroke-width="2.5"/>
  <!-- Atap Rumah Emas & Timbangan Keadilan Persiden HP -->
  <path d="M32 10 L48 22 L44 22 L44 32 L20 32 L20 22 L16 22 Z" fill="none" stroke="url(#pGold)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Tiang Timbangan -->
  <line x1="32" y1="18" x2="32" y2="29" stroke="url(#pGold)" stroke-width="1.8"/>
  <line x1="24" y1="21" x2="40" y2="21" stroke="url(#pGold)" stroke-width="1.8"/>
  <!-- Piring Timbangan Kiri & Kanan -->
  <path d="M22 25 L26 25 L24 28 Z" fill="url(#pGold)"/>
  <line x1="24" y1="21" x2="24" y2="25" stroke="url(#pGold)" stroke-width="1"/>
  <path d="M38 25 L42 25 L40 28 Z" fill="url(#pGold)"/>
  <line x1="40" y1="21" x2="40" y2="25" stroke="url(#pGold)" stroke-width="1"/>
  <!-- Huruf P (PERSIDEN) Emas & H (HP) Merah -->
  <text x="21" y="50" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="16" fill="url(#pGold)">P</text>
  <text x="33" y="50" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="16" fill="#FA0001">HP</text>
  <!-- Garis Bawah Lengkung Merah Aksen -->
  <path d="M18 55 Q32 60 46 55" fill="none" stroke="#FA0001" stroke-width="2" stroke-linecap="round"/>
</svg>
